<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>努努小镇怪异生物图鉴</title>
<link rel="stylesheet" href="nunutown.css">
</head>
<body>
<div class="app-shell">
  <div class="top-bar">
    <button class="back-btn hidden" id="backBtn" aria-label="返回">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="ttl" id="ttl">努努小镇</div>
    <button class="book-btn" id="bookBtn">📖 图鉴</button>
  </div>

  <!-- 首页 -->
  <div class="body-pad" id="homePage">
    <div class="home-hero">
      <span class="badge">FIELD NOTES</span>
      <div class="home-title">努努小镇怪异生物图鉴</div>
      <div class="home-sub">你是一名调查员。<br>完成每只努的互动挑战，即可将它收录进图鉴。</div>
    </div>

    <div class="swiper">
      <div class="swiper-track" id="creatureTrack"></div>
      <div class="swiper-dots" id="creatureDots"></div>
    </div>

    <div class="locked-row">
      <div class="locked-title">图鉴收录进度</div>
      <div class="locked-grid" id="caughtGrid"></div>
    </div>
  </div>

  <!-- 关卡选择页 -->
  <div class="body-pad hidden" id="levelPage">
    <div class="creature-card" style="margin-top:0;" id="levelCardTop"></div>
    <div class="level-list" id="levelList"></div>
  </div>

  <!-- 游戏页 -->
  <div class="body-pad hidden" id="gamePage">
    <div class="stage-hud">
      <div class="hud-card"><div class="hud-label" id="hudTimeLabel">时间</div><div class="hud-value" id="hudTime">30</div></div>
      <div class="hud-card"><div class="hud-label" id="hudHpLabel">生命</div><div class="hud-value" id="hudHp">100</div></div>
      <div class="hud-card"><div class="hud-label" id="hudExtraLabel">得分</div><div class="hud-value" id="hudExtra">0</div></div>
    </div>
    <div class="stage-wrap">
      <canvas id="stage" width="320" height="240"></canvas>
    </div>
    <div class="ctrl-row hidden" id="ctrlRow">
      <button class="ctrl-btn" id="ctrlLeft">◀ 左移</button>
      <button class="ctrl-btn" id="ctrlRight">右移 ▶</button>
    </div>
    <div class="qte-row hidden" id="qteRow">
      <button class="qte-key" data-k="A">A<small>装睡</small></button>
      <button class="qte-key" data-k="B">B<small>捂脸</small></button>
      <button class="qte-key" data-k="C">C<small>屏息</small></button>
    </div>
    <div class="stage-tip" id="stageTip"></div>
  </div>

  <!-- 图鉴页 -->
  <div class="body-pad hidden ency" id="encyPage">
    <div class="ency-frame" id="encyFrame">
      <div class="ency-h">【努努小镇怪异生物图鉴】</div>
      <div class="ency-code" id="encyCode">ARCHIVE ISA-XN-11</div>
      <div class="ency-img"><img id="encyImg" src="nu/xia.png" alt=""></div>
      <div class="ency-name" id="encyName">虾  努</div>
      <div class="ency-danger" id="encyDanger">危险等级：高</div>
      <div class="ency-sec"><div class="st">▸ 形态</div><div class="sl" id="encyForm"></div></div>
      <div class="ency-sec"><div class="st">▸ 行为</div><div class="sl" id="encyBehav"></div></div>
      <div class="ency-sec"><div class="st">▸ 生存</div><div class="sl" id="encySurvive"></div></div>
      <div class="ency-stamp" id="encyStamp">收录完成</div>
    </div>
    <div class="ency-nav" id="encyNav"></div>
  </div>
</div>

<!-- 结果弹窗 -->
<div class="overlay" id="resultOverlay">
  <div class="dialog">
    <div class="emo" id="resEmo">🎉</div>
    <img class="res-img hidden" id="resImg" src="" alt="">
    <h3 id="resTitle">挑战成功</h3>
    <p id="resText"></p>
    <div class="dialog-btns" id="resBtns"></div>
  </div>
</div>

<script src="nunutown.js"></script>
</body>
</html>
